<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Cyberpunk Pink-Cyan Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff79c6" />
      <stop offset="50%" stop-color="#bd93f9" />
      <stop offset="100%" stop-color="#8be9fd" />
    </linearGradient>
    
    <!-- Outer Glow Filter -->
    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Mask for dynamic speed-cut lines -->
    <mask id="cut-mask">
      <rect x="-10" y="-10" width="84" height="84" fill="#ffffff" />
      <!-- Horizontal cutouts (black means transparent) -->
      <path d="M -10 22 L 74 22" stroke="#000000" stroke-width="3" />
      <path d="M -10 42 L 74 42" stroke="#000000" stroke-width="3" />
    </mask>
  </defs>

  <!-- Glowing background elements or shadow -->
  <g filter="url(#glow-effect)" transform="skewX(-12) translate(4, 0)">
    <!-- Stylized polygonal racing 'S' -->
    <path d="
      M 7 7
      L 57 7
      L 57 17
      L 17 17
      L 17 27
      L 57 27
      L 57 57
      L 7 57
      L 7 47
      L 47 47
      L 47 37
      L 7 37
      Z" 
      fill="url(#neon-grad)" 
      stroke="#ffffff" 
      stroke-width="2.5" 
      stroke-linejoin="round"
      mask="url(#cut-mask)" />
  </g>
</svg>